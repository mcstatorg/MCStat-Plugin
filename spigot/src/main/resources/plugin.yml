name: McStat
version: ${project.version}
main: org.mcstat.spigot.McStatSpigotPlugin
api-version: "1.13"
folia-supported: true
softdepend: [ViaVersion, floodgate]
description: Server and player statistics for mcstat.org
author: McStat
website: https://mcstat.org
commands:
  mcstat:
    description: McStat status, reload and updates
    usage: /mcstat [status|reload|update|link]
    permission: mcstat.admin
  vote:
    description: Vote for this server on MCStat
    usage: /vote
permissions:
  mcstat.admin:
    description: Access to McStat admin commands
    default: op
